<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Cycling Hub</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #ffffff; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; margin-top: 5px; padding: 0 5px; }
        .header-title h1 { font-size: 1.6rem; color: #00f2fe; text-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
        .header-title p { color: #cfd8dc; font-size: 0.7rem; margin-bottom: 6px; }
        .sub-nav { display: flex; gap: 15px; margin-top: 6px; }
        .sub-nav a { color: #4facfe; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
        .sub-nav a:hover, .sub-nav a.active { color: #00f2fe; text-decoration: underline; }
        
        .nav-tabs { width: 100%; max-width: 800px; display: flex; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px; border-radius: 15px; margin-bottom: 20px; gap: 8px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #cfd8dc; font-weight: bold; font-size: 0.9rem; cursor: pointer; border-radius: 10px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-btn.active { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #0f2027; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        
        main { width: 100%; max-width: 800px; margin-bottom: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        .card-title { color: #00f2fe; font-size: 1.2rem; margin-bottom: 8px; }
        .info-p { color: #e0e0e0; font-size: 0.9rem; line-height: 1.6; }
        .tag { display: inline-block; background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; }

        /* Search Bar & Inputs */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #00f2fe; font-size: 1rem; }
        .search-input { width: 100%; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(0, 242, 254, 0.4); padding: 12px 15px 12px 42px; border-radius: 12px; color: #fff; outline: none; font-size: 0.95rem; transition: 0.3s; }
        .search-input:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }

        /* Chat & UI */
        .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; margin-bottom: 15px; }
        .chat-message { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 14px; border-radius: 12px; max-width: 80%; }
        .chat-message.my-msg { align-self: flex-end; background: rgba(0, 242, 254, 0.15); border-color: rgba(0, 242, 254, 0.3); }
        .chat-user { font-size: 0.78rem; color: #00f2fe; font-weight: bold; margin-bottom: 3px; }
        .chat-text { font-size: 0.88rem; color: #ffffff; word-break: break-word; }
        .chat-input-group { display: flex; gap: 8px; }
        
        .input-field { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 14px; border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; margin-bottom: 10px; }
        .input-field:focus { border-color: #00f2fe; }
        .btn-action { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: #0f2027; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        footer { text-align: center; color: #90a4ae; font-size: 0.8rem; margin-top: auto; padding: 10px 0; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>🚴‍♂️ Myanmar Cycling Hub </h1>
            <p>စက်ဘီးဆိုင်များ နှင့် စက်ဘီးဝါသနာရှင်များ စကားဝိုင်း</p>
            <div class="sub-nav">
                <a href="index.html" class="active">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('shops', event)"><i class="fa-solid fa-store"></i> Shops & Service </button>
        <button class="tab-btn" onclick="switchTab('news', event)"><i class="fa-solid fa-newspaper"></i> News </button>
        <button class="tab-btn" onclick="switchTab('chat', event)"><i class="fa-solid fa-comments"></i> Live Chat</button>
    </div>

    <main>
        <!-- 🛠️ TAB 1: SHOPS -->
        <div id="shops" class="tab-content active">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="shopSearchInput" onkeyup="searchShops()" placeholder="မြို့နယ် သို့မဟုတ် လမ်းအမည် ရိုက်ရှာပါ..." class="search-input">
            </div>
            <div id="shopsContainer">
                <p style="text-align:center; color:#cfd8dc;">စက်ဘီးဆိုင်များ စာရင်းကို ဒေါင်းလုဒ်ဆွဲနေပါသည်...</p>
            </div>
        </div>

        <!-- 📰 TAB 2: NEWS -->
        <div id="news" class="tab-content">
            <div id="newsContainer">
                <p style="text-align:center; color:#cfd8dc;"> သတင်းများကို ဒေါင်းလုဒ်ဆွဲနေပါသည်...</p>
            </div>
        </div>

        <!-- 💬 TAB 3: SUPABASE LIVE CHAT -->
        <div id="chat" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 class="card-title" style="margin: 0;"><i class="fa-solid fa-comments"></i> Cyclists Live Chat( ရိုင်း ရင် Ban မယ် ) </h3>
                </div>
                
                <!-- Chat Message ထွက်မည့်နေရာ -->
                <div class="chat-box" id="chatBox"></div>

                <div class="chat-input-group" style="flex-direction: column; gap: 8px;">
                    <!-- နာမည်ရိုက်ထည့်ရန် Input Box -->
                    <input type="text" id="chatUsername" placeholder="သင့်နာမည် ရိုက်ထည့်ပါ (ဥပမာ - Mg Mg)" class="input-field" style="margin:0;">
                    
                    <div style="display: flex; gap: 8px;">
                        <!-- စာရိုက်ရန် Input Box -->
                        <input type="text" id="chatMsg" placeholder="စာရိုက်ပါ..." class="input-field" style="margin:0; flex: 1;" onkeypress="if(event.key==='Enter') sendChatMessage()">
                        <button class="btn-action" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Myanmar Cycling Hub. စက်ဘီးဝါသနာရှင်များ အဆင်ပြေစေရန်။</p>
    </footer>

<script>
    // 1. Supabase Initialization
    const SUPABASE_URL = "https://tuqqypanefdmsubbditp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wY9hu3_JbCe3f_FJnwCvVA_7DnAIfjm";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Tab Switch Function
    function switchTab(tabId, event) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // 3. Search Shops Filter
    function searchShops() {
        const filter = document.getElementById('shopSearchInput').value.toLowerCase();
        const shopCards = document.querySelectorAll('.shop-card');
        let hasResults = false;

        shopCards.forEach(card => {
            const text = card.textContent || card.innerText;
            if (text.toLowerCase().indexOf(filter) > -1) {
                card.style.display = "";
                hasResults = true;
            } else {
                card.style.display = "none";
            }
        });

        let noResultMsg = document.getElementById('noShopMsg');
        if (!hasResults) {
            if (!noResultMsg) {
                const msgBox = document.createElement('p');
                msgBox.id = 'noShopMsg';
                msgBox.style.cssText = 'text-align:center; color:#cfd8dc; margin-top:20px;';
                msgBox.innerHTML = '❌ ရှာဖွေသော လိပ်စာ သို့မဟုတ် ဆိုင်နာမည် မတွေ့ရှိပါ။';
                document.getElementById('shopsContainer').appendChild(msgBox);
            }
        } else if (noResultMsg) {
            noResultMsg.remove();
        }
    }

    // 4. Live Chat Functions
    async function sendChatMessage() {
        const userInput = document.getElementById('chatUsername');
        const msgInput = document.getElementById('chatMsg');
        
        let username = userInput.value.trim() || "Cyclist Guest";
        const msg = msgInput.value.trim();

        if (!msg) return;

        // 🔒 တားမြစ်ထားသော စကားလုံးများ
        const forbiddenKeywords = ['admin', 'owner', 'moderator', 'system', 'sysadmin', 'mch'];

        // ရိုက်လိုက်တဲ့ နာမည်ထဲမှာ တားမြစ်စကားလုံး တစ်ခုခု ပါနေသလား စစ်ဆေးခြင်း
        const isForbidden = forbiddenKeywords.some(keyword => 
            username.toLowerCase().includes(keyword)
        );

        if (isForbidden) {
            const ADMIN_SECRET = "Naylin12##$$"; // 🔑 မိမိ Password ထည့်ပါ
            const enteredPass = prompt("Admin / Restricted Keyword ပါဝင်နေပါသဖြင့် Password ရိုက်ထည့်ပါ:");

            if (enteredPass !== ADMIN_SECRET) {
                alert("❌ Password မမှန်ကန်ပါ။ Admin သို့မဟုတ် တားမြစ်စကားလုံးများ ပါဝင်သော နာမည်ကို သုံးခွင့်မရှိပါ။");
                return; // စာပို့ခွင့်မပြုပါ
            }
        }

        // Database သို့ စာပို့ခြင်း
        const { error } = await supabaseClient
            .from('messages')
            .insert([{ username: username, text: msg }]);

        if (error) {
            console.error("Error sending message:", error);
            alert("စာပို့ရာတွင် အမှားအယွင်းရှိပါသည်: " + error.message);
        } else {
            msgInput.value = ''; // စာပို့ပြီးလျှင် Input ကွက်ကို ရှင်းပေးမည်
        }
    }

    function loadChatMessages() {
        // စာဟောင်းများ ဖတ်ယူခြင်း
        supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true })
            .limit(50)
            .then(({ data, error }) => {
                if (data) {
                    const chatBox = document.getElementById('chatBox');
                    chatBox.innerHTML = '';
                    data.forEach(m => renderMessage(m));
                }
            });

        // Realtime စာသစ်များ ဖတ်ယူခြင်း
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderMessage(payload.new);
            })
            .subscribe();
    }

    function renderMessage(m) {
        const chatBox = document.getElementById('chatBox');
        if (!chatBox) return;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-message`;
        msgDiv.innerHTML = `
            <div class="chat-user">${m.username || 'Cyclist'}</div>
            <div class="chat-text">${m.text}</div>
        `;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 5. Google Sheets Data Fetching
    const sheetID = "1JUq3E0fGbYRNRfFgEk7lGxKzquiyRqkeRDUwDWp4a2E";

    function fetchNewsFromSheet() {
        const newsSheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=News&tqx=out:json`;
        fetch(newsSheetURL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substring(47, data.length - 2));
                const rows = json.table.rows;
                const container = document.getElementById('newsContainer');
                container.innerHTML = '';

                if (!rows || rows.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#cfd8dc;">သတင်းများ မရှိသေးပါ။</p>';
                    return;
                }

                rows.slice().reverse().forEach(row => {
                    const title = row.c && row.c[0] ? row.c[0].v : '';
                    const date = row.c && row.c[1] ? row.c[1].v : '';
                    const content = row.c && row.c[2] ? row.c[2].v : '';

                    if (title || content) {
                        container.innerHTML += `
                            <div class="card">
                                ${date ? `<span class="tag" style="float:right;">${date}</span>` : ''}
                                <h3 class="card-title">${title}</h3>
                                <p class="info-p" style="white-space: pre-line;">${content}</p>
                            </div>
                        `;
                    }
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('newsContainer').innerHTML = '<p style="text-align:center; color:#cfd8dc;">သတင်းများ ဆွဲယူ၍ မရသေးပါ။</p>';
            });
    }

    function fetchShopsFromSheet() {
        const shopSheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=Shops&tqx=out:json`;
        fetch(shopSheetURL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substring(47, data.length - 2));
                const rows = json.table.rows;
                const container = document.getElementById('shopsContainer');
                container.innerHTML = '';

                if (!rows || rows.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#cfd8dc;">ဆိုင်များ မရှိသေးပါ။</p>';
                    return;
                }

                rows.forEach(row => {
                    const name = row.c && row.c[0] ? row.c[0].v : '';
                    const service = row.c && row.c[1] ? row.c[1].v : '';
                    const address = row.c && row.c[2] ? row.c[2].v : '';
                    const status = row.c && row.c[3] ? row.c[3].v : 'Open Daily';

                    if (name || address) {
                        container.innerHTML += `
                            <div class="card shop-card">
                                <h3 class="card-title"><i class="fa-solid fa-bicycle"></i> ${name}</h3>
                                <p class="info-p"><b>ဝန်ဆောင်မှု:</b> ${service}</p>
                                <p class="info-p"><b>လိပ်စာ:</b> ${address}</p>
                                <span class="tag" style="margin-top:8px;">${status}</span>
                            </div>
                        `;
                    }
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('shopsContainer').innerHTML = '<p style="text-align:center; color:#cfd8dc;">ဆိုင်စာရင်းများ ဆွဲယူ၍ မရသေးပါ။</p>';
            });
    }

    // DOM Ready ဖြစ်ချိန်တွင် စတင် run မည့် လုပ်ဆောင်ချက်များ
    document.addEventListener('DOMContentLoaded', () => {
        loadChatMessages();
        fetchNewsFromSheet();
        fetchShopsFromSheet();
    });
</script>
</body>
</html>    
</body>
</html>
